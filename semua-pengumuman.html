<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Pengumuman - Media Center Kemenag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; } .header-curve { border-bottom: 3px solid #16a34a; } </style>
</head>
<body>
    <header class="bg-white px-8 py-4 flex justify-between items-center shadow-sm header-curve">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-[#1a5336]">Arsip Pengumuman</h1>
        </div>
        <a href="index.html" class="text-sm font-bold text-gray-600 hover:text-green-700 transition"><i class="fa-solid fa-arrow-left mr-2"></i> Kembali ke Beranda</a>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-[#1a5336] text-white px-5 py-4">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-bell mr-2"></i> Seluruh Pengumuman</h3>
            </div>
            <div class="p-6">
                <ul class="space-y-4" id="all-pengumuman-container">
                    <p class="text-gray-500 animate-pulse">Memuat pengumuman...</p>
                </ul>
            </div>
        </div>
    </main>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DISINI (SAMA SEPERTI DI INDEX.HTML)
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8Ewbw6oKHND33rqWpCweP0ptyAJAT-7RSX_a7s9cUrKqfy79BlWFgPXIqfDm5NKqS/exec';

        function formatTanggal(tgl) {
            try {
                const d = new Date(tgl);
                return isNaN(d) ? tgl : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            } catch(e) { return tgl; }
        }

        fetch(APPS_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('all-pengumuman-container');
                if(data.pengumuman && data.pengumuman.length > 0) {
                    let html = '';
                    // Menampilkan SEMUA pengumuman yang ada di Google Sheets
                    data.pengumuman.forEach(p => {
                        html += `
                            <li class="flex items-start gap-4 pb-4 border-b border-gray-100 last:border-0 last:pb-0">
                                <div class="w-2.5 h-2.5 mt-2 rounded-full bg-[#1a5336] flex-shrink-0"></div>
                                <div>
                                    <p class="text-gray-900 font-semibold text-[16px] leading-snug">${p.teks}</p>
                                    <p class="text-sm text-gray-500 mt-1 font-medium"><i class="fa-regular fa-calendar-days mr-1"></i> ${formatTanggal(p.tanggal)}</p>
                                </div>
                            </li>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p class="text-gray-500">Belum ada pengumuman.</p>';
                }
            })
            .catch(error => {
                document.getElementById('all-pengumuman-container').innerHTML = '<p class="text-red-500">Gagal terhubung ke server.</p>';
            });
    </script>
</body>
</html>
