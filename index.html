<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Center Kemenag Pohuwato</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8fafc; 
        }
        .header-curve {
            border-bottom: 3px solid #16a34a;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Topbar & Header -->
    <header class="bg-white px-8 py-3 flex justify-between items-center shadow-sm header-curve">
        <div class="flex items-center gap-4">
            <!-- Logo Kemenag -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Kementerian_Agama_new_logo.png?utm_source=id.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo Kemenag" class="h-14">
            <div>
                <h1 class="text-3xl font-bold text-[#1a5336] leading-none">Media Center</h1>
                <p class="text-gray-700 font-medium text-sm mt-1">Kementerian Agama Kabupaten Pohuwato</p>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-5 text-sm text-gray-700">
            <div class="flex items-center gap-2">
                <i class="fa-regular fa-calendar-days text-green-700"></i>
                <span id="current-date" class="font-medium"></span>
            </div>
            <div class="h-6 w-px bg-gray-300"></div>
            <div class="flex items-center gap-2 cursor-pointer group">
                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-700 group-hover:bg-green-200 transition">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="font-medium">Admin</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="w-full border-b-8 border-green-600 bg-white">
        <!-- Pastikan nama file gambar banner Anda adalah banner.png dan sudah di-upload ke GitHub -->
        <img src="banner.png" alt="Banner Media Center Kemenag Pohuwato" class="w-full h-auto object-cover max-h-[500px]">
    </section>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Section: Layanan Utama -->
        <div class="mb-10">
            <div class="inline-block bg-[#1a5336] text-white px-6 py-2.5 rounded-t-xl font-bold shadow-md">
                <i class="fa-solid fa-border-all mr-2"></i> Layanan Utama
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mt-2">
                
                <!-- Card 1: E-Cuti -->
                <a href="https://e-cuti.pohuwatokemenag.id" target="_blank" class="bg-[#eafaf1] rounded-2xl p-6 shadow-sm border border-green-100 flex flex-col items-center text-center card-hover transition duration-300">
                    <div class="text-6xl text-green-600 mb-4 relative mt-2">
                        <i class="fa-regular fa-calendar-check"></i>
                        <i class="fa-solid fa-clock absolute -bottom-1 -right-2 text-2xl text-yellow-500 bg-white rounded-full"></i>
                    </div>
                    <h3 class="font-bold text-xl text-gray-900 mt-2">E-Cuti</h3>
                    <p class="text-sm text-gray-700 mb-6 font-medium">Pengajuan Cuti Online</p>
                    <div class="mt-auto bg-[#1a5336] text-white w-8 h-8 flex justify-center items-center rounded-full ml-auto shadow">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </div>
                </a>

                <!-- Card 2: Layanan KUA -->
                <a href="#" class="bg-[#ebf5ff] rounded-2xl p-6 shadow-sm border border-blue-100 flex flex-col items-center text-center card-hover transition duration-300">
                    <div class="text-6xl text-[#1a5336] mb-4 mt-2">
                        <i class="fa-solid fa-mosque"></i>
                    </div>
                    <h3 class="font-bold text-xl text-gray-900 mt-2">Layanan KUA</h3>
                    <p class="text-sm text-gray-700 mb-6 font-medium">Layanan Urusan Agama</p>
                    <div class="mt-auto bg-[#1a5336] text-white w-8 h-8 flex justify-center items-center rounded-full ml-auto shadow">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </div>
                </a>

                <!-- Card 3: Madrasah -->
                <a href="#" class="bg-[#fff9e6] rounded-2xl p-6 shadow-sm border border-yellow-100 flex flex-col items-center text-center card-hover transition duration-300">
                    <div class="text-6xl text-[#1a5336] mb-4 relative mt-2">
                        <i class="fa-solid fa-book-open"></i>
                        <i class="fa-solid fa-graduation-cap absolute -top-5 left-1/2 -translate-x-1/2 text-4xl text-green-800"></i>
                    </div>
                    <h3 class="font-bold text-xl text-gray-900 mt-2">Madrasah</h3>
                    <p class="text-sm text-gray-700 mb-6 font-medium">Informasi & Layanan</p>
                    <div class="mt-auto bg-[#1a5336] text-white w-8 h-8 flex justify-center items-center rounded-full ml-auto shadow">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </div>
                </a>

                <!-- Card 4: Informasi Publik -->
                <a href="#" class="bg-[#f3e8ff] rounded-2xl p-6 shadow-sm border border-purple-100 flex flex-col items-center text-center card-hover transition duration-300">
                    <div class="text-6xl text-indigo-800 mb-4 relative mt-2">
                        <i class="fa-regular fa-file-lines"></i>
                        <i class="fa-solid fa-circle-info absolute -bottom-1 -right-2 text-2xl text-[#1a5336] bg-white rounded-full"></i>
                    </div>
                    <h3 class="font-bold text-xl text-gray-900 mt-2">Informasi Publik</h3>
                    <p class="text-sm text-gray-700 mb-6 font-medium">PPID Kemenag</p>
                    <div class="mt-auto bg-[#1a5336] text-white w-8 h-8 flex justify-center items-center rounded-full ml-auto shadow">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </div>
                </a>

            </div>
        </div>

        <!-- Section: Berita & Pengumuman -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Berita Terbaru -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-[#1a5336] text-white px-5 py-3.5 flex justify-between items-center">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-bullhorn mr-2"></i> Berita Terbaru</h3>
                    <a href="#" class="text-sm font-medium hover:text-green-200 transition flex items-center">Lihat Semua <i class="fa-solid fa-arrow-right ml-1.5"></i></a>
                </div>
                <div class="p-5" id="berita-container">
                    <!-- Skeleton Loading -->
                    <div class="animate-pulse flex gap-4">
                        <div class="rounded-xl bg-gray-200 h-28 w-40"></div>
                        <div class="flex-1 space-y-3 py-1">
                            <div class="h-5 bg-gray-200 rounded w-full"></div>
                            <div class="h-5 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-200 rounded w-1/3 mt-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pengumuman -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-[#1a5336] text-white px-5 py-3.5 flex justify-between items-center">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-bell mr-2"></i> Pengumuman</h3>
                    <a href="#" class="text-sm font-medium hover:text-green-200 transition flex items-center">Lihat Semua <i class="fa-solid fa-arrow-right ml-1.5"></i></a>
                </div>
                <div class="p-5">
                    <ul class="space-y-4" id="pengumuman-container">
                        <!-- Skeleton Loading -->
                        <li class="animate-pulse flex gap-3">
                            <div class="w-2 h-2 mt-1.5 rounded-full bg-gray-300"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-4 bg-gray-200 rounded w-full"></div>
                                <div class="h-3 bg-gray-200 rounded w-1/4"></div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-sm text-gray-500 mt-6 border-t border-gray-200 bg-white">
        <div class="w-48 h-1 bg-green-600 mx-auto mb-4 rounded-full opacity-50"></div>
        <p class="font-medium text-gray-600">Kementerian Agama Kabupaten Pohuwato</p>
    </footer>

    <!-- Logika Aplikasi -->
    <script>
        // PASTIKAN ANDA MENGGANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQNSOIB7Wz2CXhTahDvJFlsSHRwFNXf8otK3RQ6AmRoxLdDdmQy0SLFqp8wPDbZWRM/exec';

        // Set Tanggal Hari Ini di Header
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', dateOptions);

        // Render Data API
        if(APPS_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbyQNSOIB7Wz2CXhTahDvJFlsSHRwFNXf8otK3RQ6AmRoxLdDdmQy0SLFqp8wPDbZWRM/exec') {
            fetch(APPS_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    
                    // 1. Render Berita Terbaru
                    if(data.berita && data.berita.length > 0) {
                        const b = data.berita[0];
                        document.getElementById('berita-container').innerHTML = `
                            <div class="flex gap-5 items-start cursor-pointer group">
                                <img src="${b.gambar}" alt="Berita" class="w-40 h-28 object-cover rounded-xl shadow-sm border border-gray-100 group-hover:opacity-90 transition">
                                <div class="flex-1">
                                    <h4 class="font-bold text-gray-800 text-lg leading-snug group-hover:text-[#1a5336] transition line-clamp-2">${b.judul}</h4>
                                    <div class="flex items-center gap-2 mt-3 text-sm text-gray-500 font-medium">
                                        <i class="fa-regular fa-calendar-days"></i>
                                        <span>${b.tanggal}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        document.getElementById('berita-container').innerHTML = '<p class="text-gray-500 text-sm p-2">Belum ada berita terbaru.</p>';
                    }

                    // 2. Render Pengumuman
                    if(data.pengumuman && data.pengumuman.length > 0) {
                        let htmlPengumuman = '';
                        data.pengumuman.forEach(p => {
                            htmlPengumuman += `
                                <li class="flex items-start gap-3 pb-3 border-b border-gray-50 last:border-0 last:pb-0">
                                    <div class="w-2 h-2 mt-2 rounded-full bg-[#1a5336] flex-shrink-0"></div>
                                    <div>
                                        <p class="text-gray-900 font-semibold text-[15px] leading-snug">${p.teks}</p>
                                        <p class="text-sm text-gray-500 mt-1 font-medium">${p.tanggal}</p>
                                    </div>
                                </li>
                            `;
                        });
                        document.getElementById('pengumuman-container').innerHTML = htmlPengumuman;
                    } else {
                        document.getElementById('pengumuman-container').innerHTML = '<p class="text-gray-500 text-sm p-2">Belum ada pengumuman.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error memuat data:', error);
                    document.getElementById('berita-container').innerHTML = '<p class="text-red-500 text-sm p-2">Gagal terhubung ke server. Pastikan URL Apps Script sudah benar dan memiliki akses publik.</p>';
                    document.getElementById('pengumuman-container').innerHTML = '<p class="text-red-500 text-sm p-2">Gagal memuat pengumuman.</p>';
                });
        }
    </script>
</body>
</html>
